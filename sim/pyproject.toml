[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngram-accept-sim"
version = "0.1.0"
description = "Offline n-gram speculative decoding acceptance simulator"
requires-python = ">=3.10"
dependencies = ["tokenizers>=0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
